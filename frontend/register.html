<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Smart Queue Predictor
    </title>

    <!-- Register CSS -->

    <link
        rel="stylesheet"
        href="css/register.css"
    >

</head>


<body>


    <!-- =====================================================
         REGISTER PAGE
         ===================================================== -->

    <div class="register-container">


        <!-- LOGO -->

        <img
            src="images/logo.png"
            alt="Smart Queue Predictor Logo"
            class="register-logo"
        >


        <!-- TITLE -->

        <h1>
            Create Account
        </h1>


        <p>
            Register for Smart Queue Predictor
        </p>


        <!-- =================================================
             REGISTER FORM
             ================================================= -->

        <form
            id="registerForm"
        >


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <!-- REGISTER BUTTON -->

            <button
                type="button"
                id="registerButton"
                onclick="register()"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
            ></div>


        </form>


        <!-- LOGIN LINK -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- HOME -->

        <div class="login-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>


    <!-- REGISTER JAVASCRIPT -->

    <script
        src="js/register.js"
    ></script>


</body>

</html>
