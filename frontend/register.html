<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Register</h2>

    <input
        id="name"
        placeholder="Name"
    >

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="register()">
        Register
    </button>

    <p id="message"></p>

</div>

<script src="js/register.js"></script>

</body>
</html>
