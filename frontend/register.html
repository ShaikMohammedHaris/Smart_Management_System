<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Smart Queue Predictor
    </title>

    <link
        rel="stylesheet"
        href="css/register.css"
    >

</head>


<body>

    <div class="register-container">

        <img
            src="images/logo.png"
            alt="Smart Queue Predictor Logo"
            class="register-logo"
        >


        <h1>
            Create Account
        </h1>


        <p>
            Register for Smart Queue Predictor
        </p>

        <form
            id="registerForm"
        >


            <label for="name">
                Full Name
            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >



            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <button
                type="button"
                id="registerButton"
                onclick="register()"
            >
                Create Account
            </button>


            <div
                id="message"
            ></div>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <div class="login-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>



    <script
        src="js/register.js"
    ></script>


</body>

</html>
