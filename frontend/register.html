<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Queue Predictor</title>

    <link rel="stylesheet"
          href="css/register.css">

</head>


<body>

    <div class="register-container">

        <div class="register-card">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="images/logo.png"
                    alt="Smart Queue Predictor Logo"
                    class="logo"
                >

            </div>


            <!-- TITLE -->

            <h1>Create Account</h1>

            <p class="subtitle">
                Register for your Smart Queue account
            </p>


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                autocomplete="off"
            >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p
                    id="message"
                    class="message"
                ></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- HOME -->

            <a
                href="index.html"
                class="home-link"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
