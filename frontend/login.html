<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Queue Predictor</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <div class="login-container">

        <img
            src="images/logo.png"
            alt="Smart Queue Predictor Logo"
            class="login-logo"
        >

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your Smart Queue account
        </p>

        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

            <div id="message"></div>

        </form>

        <div class="create-account">

            Don't have an account?

            <a href="register.html">
                Create account
            </a>

        </div>

        <div class="create-account">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
