<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

    <a href="register.html">
        Create account
    </a>

</div>

<script src="js/login.js"></script>

</body>
</html>
